name: Selftest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run DocsPulse Action on broken-repo
        uses: ./
        continue-on-error: true
        with:
          path: demo/broken-repo
          provider: none

      - name: Verify report.md was generated
        shell: bash
        run: |
          if [ ! -f report.md ]; then
            echo "Error: report.md was not generated by DocsPulse"
            exit 1
          fi
          echo "Generated report.md:"
          cat report.md
